services:
  portfolio-rebalancer:
    build:
      context: ./rebalanse
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.tuna.tsinghua.edu.cn}
    container_name: portfolio-rebalancer
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./rebalanse/client_data.json:/app/client_data.json

  news-service:
    build:
      context: ./news
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.tuna.tsinghua.edu.cn}
    container_name: news-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_FILE: /app/data/financial_news.json
      NEWS_SERVICE_PORT: 8002
    volumes:
      - ./news/data:/app/data

  survey-service:
    build:
      context: ./first_opros
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.tuna.tsinghua.edu.cn}
    container_name: survey-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEWS_SERVICE_URL: http://news-service:8002
      VOICE_BROKER_URL: http://voice-broker:8010/analyze
      SESSION_TTL_SECONDS: 180
      GIGACHAT_MODEL: GigaChat-2-Pro
      TINKOFF_SANDBOX_ENABLED: ${TINKOFF_SANDBOX_ENABLED:-true}
      TINKOFF_SANDBOX_TOKEN: ${TINKOFF_SANDBOX_TOKEN:-}
      TINKOFF_SANDBOX_ACCOUNT_ID: ${TINKOFF_SANDBOX_ACCOUNT_ID:-}
    depends_on:
      - news-service
      - voice-broker
    ports:
      - "8001:8001"

  frontend:
    build:
      context: ./frontend
    container_name: finans-frontend
    restart: unless-stopped
    depends_on:
      - survey-service
    ports:
      - "8080:8080"

  voice-broker:
    build:
      context: ./voice_broker
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.tuna.tsinghua.edu.cn}
    container_name: voice-broker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GIGACHAT_MODEL: GigaChat-2-Pro
    ports:
      - "8010:8010"
