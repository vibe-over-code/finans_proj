services:
  portfolio-rebalancer:
    build:
      context: ./rebalanse
    container_name: portfolio-rebalancer
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./rebalanse/client_data.json:/app/client_data.json

  news-service:
    build:
      context: ./news
    container_name: news-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORTFOLIO_SERVICE_URL: http://portfolio-rebalancer:8000/api/check_portfolio
      DATA_FILE: /app/data/financial_news.json
    depends_on:
      - portfolio-rebalancer
    volumes:
      - ./news/data:/app/data

  survey-service:
    build:
      context: ./first_opros
    container_name: survey-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORTFOLIO_PROFILE_URL: http://portfolio-rebalancer:8000/api/client-profile
    depends_on:
      - portfolio-rebalancer
    ports:
      - "8001:8001"

  voice-broker:
    build:
      context: ./voice_broker
    container_name: voice-broker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      QWEN2_AUDIO_MODEL: ${QWEN2_AUDIO_MODEL:-Qwen/Qwen2-Audio-7B-Instruct}
      VOICE_MAX_NEW_TOKENS: ${VOICE_MAX_NEW_TOKENS:-256}
      VOICE_SAMPLE_RATE: ${VOICE_SAMPLE_RATE:-16000}
      VOICE_MAX_SECONDS: ${VOICE_MAX_SECONDS:-30}
    ports:
      - "8010:8010"
    gpus: all

