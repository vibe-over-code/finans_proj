services:
  portfolio-rebalancer:
    build:
      context: ./rebalanse
    container_name: portfolio-rebalancer
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./rebalanse/client_data.json:/app/client_data.json

  news-service:
    build:
      context: ./news
    container_name: news-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORTFOLIO_SERVICE_URL: http://portfolio-rebalancer:8000/api/check_portfolio
      DATA_FILE: /app/data/financial_news.json
    depends_on:
      - portfolio-rebalancer
    volumes:
      - ./news/data:/app/data

  survey-service:
    build:
      context: ./first_opros
    container_name: survey-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORTFOLIO_PROFILE_URL: http://portfolio-rebalancer:8000/api/client-profile
      VOICE_SERVICE_URL: http://voice-broker:8010/analyze
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat-2-Pro}
      GIGACHAT_VERIFY_SSL: ${GIGACHAT_VERIFY_SSL:-false}
    depends_on:
      - portfolio-rebalancer
      - voice-broker
    ports:
      - "8001:8001"

  voice-broker:
    build:
      context: ./voice_broker
    container_name: voice-broker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat-2-Pro}
      GIGACHAT_VERIFY_SSL: ${GIGACHAT_VERIFY_SSL:-false}
      VOICE_PROMPT: ${VOICE_PROMPT:-Return valid JSON with transcript, emotion, emotion_index, summary.}
    ports:
      - "8010:8010"